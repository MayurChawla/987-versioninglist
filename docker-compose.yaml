version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: releasecheck_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: releasecheck_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d releasecheck_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: releasecheck_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/releasecheck_db?schema=public
      - NODE_ENV=production
      - NEXT_PUBLIC_GRAPHQL_ENDPOINT=/api/graphql
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run db:seed && npx next start"

volumes:
  postgres_data:
